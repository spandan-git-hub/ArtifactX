[pytest]
testpaths = tests
pythonpath = .
addopts = -m "not slow and not pg" --strict-markers
markers =
    unit: pure functions and unit tests (no DB)
    integration: service, repository, and database tests
    e2e: end-to-end pipeline tests through normal ingest path
    differential: differential tests vs reference tools
    slow: large-file or long-running tests
    pg: tests requiring PostgreSQL dialect via TEST_DATABASE_URL
    fuzz: fuzz tests with mutated inputs
