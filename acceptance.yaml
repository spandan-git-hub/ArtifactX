# ArtifactX — Acceptance Criteria Targets
# Follows master.md R1, R8, R11, R13 and 00_PROJECT_CONTEXT.md §4, 02_GROUND_TRUTH_DATASETS.md §5
# IMPORTANT: Load with yaml.safe_load only in tools and tests.
# Thresholds and targets are evaluated against DEV datasets; frozen prior to HOLDOUT evaluation (DEC-013).

version: "1.0.0"
created_date: "2026-10-14"

integrity:
  rehash_stability: 1.0                    # Recomputed hashes must match 100%
  tamper_detection_rate: 1.0               # Single-byte mutations detected 100% (DS-08)
  audit_chain_tamper_detection: 1.0        # Tampered audit entries detected 100%

decryption:
  decrypt_parity: 1.0                      # Output byte-identical (SHA-256) to reference tool (DS-02, DS-03)
  negative_typed_error_rate: 1.0           # Negatives fail cleanly with typed errors (DS-04)
  key_redaction_rate: 1.0                  # Zero key material logged or stored (R5)

parsing:
  parse_accuracy_min: 0.99                 # Correct sender, timestamp, and body (target 100% on synthetic)
  telethon_blob_reread_min: 1.0            # Telethon re-reads 100% of well-formed blobs (DS-05)
  unparsed_blob_fallback_rate: 1.0         # Unknown constructors preserved with honest UNPARSED_BLOB

recovery:
  recovery_recall_tier1_min: 0.95          # Tier 1 explicit revocation recovery
  recovery_recall_tier2_min: 0.80          # Tier 2 WAL historical page recovery
  recovery_recall_tier3_min: 0.70          # Tier 3 freelist and slack carving
  unrecoverable_control_recovered_max: 0.0 # Vacuumed and secure_delete controls never falsely recovered
  id_gap_confidence_max: 0.30              # ID gaps demoted to weak_hint (DEC-014)

correlation:
  planted_links_recall_min: 1.0            # 100% of planted shared entities discovered (DS-06)
  decoys_linked_max: 0.0                   # 0 decoys linked above reporting threshold (DS-06)
  control_fpr_max: 0.0                     # 0 cross-platform links on unrelated control device (DS-07)

reproducibility:
  content_hash_identity: 1.0               # Identical inputs & config produce identical hashes (R11)
  ordering_determinism: 1.0                # Deterministic finding and timeline sort order

traceability:
  finding_provenance_coverage: 1.0         # 100% of findings link to source evidence & offset/table
  limitations_coverage: 1.0                # Every finding includes explicit limitations list
